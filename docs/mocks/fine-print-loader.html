<!doctype html>
<!-- Approved mock for the Poster and Fine print loader. Open it in a browser.
     All Concerts, counts and prices here are made up. Timers stand in for real SSE events.
     docs/specs/04-interface.md is the source of truth. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fine print loader mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Big+Shoulders+Display:wght@800&family=Hanken+Grotesk:wght@400;500;700&family=Doto:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;max-width:760px;margin-inline:auto}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}h3,p{margin:0}
.seg{margin:0 0 12px;font:500 14px sans-serif}.seg button{padding:7px 12px;border:1px solid #ccc;border-radius:8px}
.app{position:relative;overflow:hidden;isolation:isolate;border-radius:8px;background:#FF5A1F;color:#10291F;font-family:"Bricolage Grotesque",sans-serif;padding:20px;text-align:center;font-variant-numeric:tabular-nums}
.sun{position:absolute;z-index:-1;left:50%;top:190px;width:1100px;height:1100px;margin-left:-550px;border-radius:50%;background:repeating-conic-gradient(#FF7A1F 0 7.5deg,#FF5A1F 7.5deg 15deg);animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bar{display:grid;grid-template-columns:1fr auto;background:#10291F;color:#FFD3E4;border-radius:6px}.bar input{min-width:0;background:none;border:0;color:inherit;font:600 16px "Bricolage Grotesque",sans-serif;padding:11px 12px;text-overflow:ellipsis}.bar button{font-weight:700;background:#FFD3E4;color:#10291F;padding:0 14px;margin:5px;border-radius:4px;font-size:15px;white-space:nowrap}
.place{margin:18px 0 8px;font-size:18px;font-weight:700;min-height:24px}
.stage{position:relative;min-height:262px}
.stage ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.5em}.stage li{display:contents}.br{flex-basis:100%;height:0}
.nm{position:relative;line-height:1;font-weight:700;font-stretch:75%;letter-spacing:-.02em;transform-origin:50% 50%}.nm.fly{will-change:transform}.nm .pk{position:absolute;inset:0;color:#FFD3E4;opacity:0;pointer-events:none}.nm.cur .pk{opacity:1}.t1{flex-basis:100%;font-size:clamp(46px,12.4vw,92px);font-weight:800}.t2{font-size:clamp(32px,7.8vw,58px)}.t3{font-size:clamp(20px,4.1vw,29px);margin-top:8px}
.load{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}.load.on{display:flex}
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-size:17px;font-weight:600;line-height:1.3;max-width:640px}.wall span{transition:opacity .28s}.wall .no{opacity:0}.wall .yes{color:#FFD3E4}.wall span.new{opacity:0}
.eq{display:flex;align-items:flex-end;gap:7px;height:96px}.eq i{width:14px;height:100%;background:#10291F;transform-origin:bottom;animation:eq 1s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:-.75s}.eq i:nth-child(3){animation-delay:-.3s}.eq i:nth-child(4){animation-delay:-.55s}.eq i:nth-child(5){animation-delay:-.15s}@keyframes eq{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
.line{font:500 16px "Hanken Grotesk",sans-serif;margin-top:14px;min-height:22px}
.deck{position:relative;height:216px;max-width:520px;margin:20px auto 0;text-align:left}
.stub{position:absolute;inset:0;display:grid;grid-template-columns:1fr 98px;color:#1A1A18;border-radius:8px}
.stub .m{padding:14px 16px;display:flex;flex-direction:column;min-width:0}.stub .te{border-left:3px dotted #1A1A1866;padding:14px 8px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.dt{font:800 32px/.9 Doto,sans-serif}.stub small{font:700 12px "Hanken Grotesk",sans-serif}.stub h3{font:800 32px/.98 "Big Shoulders Display",sans-serif;margin-top:8px}.stub p{font:400 15px/1.35 "Hanken Grotesk",sans-serif;margin-top:5px}.stub .bt{margin-top:auto;font:700 14px "Hanken Grotesk",sans-serif}.stub a{color:inherit}.pr{font:800 26px/1 Doto,sans-serif}
.ctl{display:flex;justify-content:center;gap:10px;margin-top:14px;font-weight:700}.ctl button{padding:9px 18px;border:2px solid #10291F;border-radius:6px;min-width:92px}
.off,.app.loading .ctl{visibility:hidden}
@media(max-width:560px){.stage{min-height:230px}.wall{font-size:14px;gap:1px 9px}.stub{grid-template-columns:1fr 72px}.deck{height:238px}.pr{font-size:19px}.stub small{font-size:10.5px}.stub h3{font-size:27px}.stub .te{padding:12px 4px}}
@media(prefers-reduced-motion:reduce){.sun,.eq i{animation:none}*{transition-duration:.01ms!important}}
</style></head><body>
<div class="seg"><button id="a">Replay search</button></div>
<section class="app"><div class="sun"></div>
<form class="bar" onsubmit="return false"><input aria-label="Search" value="Something like Khruangbin in Chicago, next two weekends"><button id="go">Find concerts</button></form>
<p class="place">Chicago, Nov 6 to 15</p>
<div class="stage"><div class="load" id="lw"><div class="wall"></div></div><div class="load" id="le"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div><ul></ul></div>
<p class="line" aria-live="polite"></p>
<div class="deck"></div><div class="ctl"><button>Skip</button><button>Save</button></div></section>
<script>
const still=matchMedia('(prefers-reduced-motion:reduce)').matches,$=s=>document.querySelector(s);
const P=[["Hermanos Gutiérrez","Thalia Hall","Fri","Nov 6","8 PM",38,"The same patient, reverb-heavy guitar as Khruangbin, with even fewer words.",1],["Altın Gün","Metro","Sat","Nov 7","9 PM",32,"",2],["Men I Trust","The Salt Shed","Fri","Nov 13","8 PM",48,"",2],["Mdou Moctar","Empty Bottle","Sat","Nov 14","9 PM",29,"",3],["Yīn Yīn","Lincoln Hall","Sat","Nov 7","8 PM",27,"",3],["Tinariwen","Old Town School","Sun","Nov 8","7 PM",45,"",3],["Crumb","Schubas","Fri","Nov 13","9 PM",30,"",3],["Babe Rainbow","Sleeping Village","Sun","Nov 15","8 PM",24,"",3]];
const OTHER="Rhye,Pixies,Bonobo,Beach House,Tame Impala,Mild High Club,The Budos Band,Bibio,Toro y Moi,Vulfpeck,Parcels,Glass Beams,Ezra Collective,Thee Sacred Souls,Black Pumas,Allah-Las,Nick Hakim,L'Rain,Cautious Clay,Sault,King Gizzard,Cymande,Durand Jones,BADBADNOTGOOD,El Michels Affair,Surprise Chef,Say She She,Menahan Street Band,Natural Information Society,Kokoroko".split(',');
const app=$('.app'),ul=$('.stage ul'),deck=$('.deck'),line=$('.line'),wall=$('.wall');
P.forEach((p,i)=>{ul.insertAdjacentHTML('beforeend',`<li><button class="nm t${p[7]}"><span>${p[0]}</span><span class="pk" aria-hidden="true">${p[0]}</span></button></li>`+(i==2?'<li><i class="br"></i></li>':''))});
const ns=[...ul.querySelectorAll('.nm')],NAMES=[...OTHER,...P.map(p=>p[0])].map(x=>[Math.sin(x.length*91.7+x.charCodeAt(1))%1,x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);let timers=[];
function ticket(){const p=P[0];ns[0].classList.add('cur');deck.innerHTML=`<article class="stub" style="background:#F7C5D5"><div class="m"><div class="dt">${p[3]}</div><h3>${p[0]}</h3><p>${p[6]}</p><div class="bt">${p[1]}, ${p[2]} ${p[4]}</div></div><div class="te"><small>Admit one</small><div class="pr">$${p[5]}</div><small><a href="#">Tickets</a></small></div></article>`;app.classList.remove('loading');if(!still)deck.firstChild.animate([{transform:'translateY(12px)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.22,.61,.36,1)'})}
const MOVE=750,GAP=100,REST=80,GROW=450,READ=550,INOUT='cubic-bezier(.65,0,.35,1)',OUT='cubic-bezier(.22,.61,.36,1)';
function run(){timers.forEach(clearTimeout);timers=[];const at=(t,f)=>timers.push(setTimeout(f,still?0:t));document.querySelectorAll('.load').forEach(l=>l.classList.remove('on'));app.classList.add('loading');ul.classList.add('off');ns.forEach(n=>{n.classList.remove('cur','fly');[n,...n.children].forEach(e=>e.getAnimations().forEach(a=>a.cancel()))});deck.innerHTML='';wall.innerHTML=NAMES.map(n=>`<span class="new">${n}</span>`).join('');const sp2=[...wall.children],isPick=s=>P.some(p=>p[0]==s.textContent);$('#le').classList.add('on');line.textContent='Reading your request';
at(500,()=>{$('#le').classList.remove('on');$('#lw').classList.add('on');line.textContent='Found 212 concerts near Chicago'});sp2.forEach((s,i)=>at(500+i*32,()=>s.classList.remove('new')));at(1800,()=>line.textContent='38 close matches, ranking them');
at(3000,()=>{line.textContent='8 picks from 38 close matches';sp2.filter(isPick).forEach(s=>s.classList.add('yes'));sp2.filter(s=>!isPick(s)).forEach(s=>s.classList.add('no'));
at(READ,()=>{ul.classList.remove('off');const rs=ns.map(n=>n.getBoundingClientRect()),fr=ns.map((n,i)=>sp2.find(s=>s.textContent==P[i][0]).getBoundingClientRect());$('#lw').classList.remove('on');if(still)return ticket();const end=MOVE+GAP*7+REST+GROW;ns.forEach((n,i)=>{n.classList.add('fly');const a=fr[i],b=rs[i],s=a.width/b.width,dx=a.left+a.width/2-b.left-b.width/2,dy=a.top+a.height/2-b.top-b.height/2,o1=(i*GAP+MOVE)/end,o2=(end-GROW)/end,o0=i*GAP/end,from=`translate(${dx}px,${dy}px) scale(${s})`,land=`translate(0px,0px) scale(${s})`;const an=n.animate([{transform:from,offset:0},{transform:from,offset:o0,easing:INOUT},{transform:land,offset:o1},{transform:land,offset:o2,easing:OUT},{transform:'translate(0px,0px) scale(1)',offset:1}],{duration:end});an.onfinish=()=>n.classList.remove('fly');n.querySelector('.pk').animate(i?[{opacity:1,offset:0},{opacity:1,offset:o2},{opacity:0,offset:1}]:[{opacity:1},{opacity:1}],{duration:end})});at(end,ticket)})})}
$('#a').onclick=run;$('#go').onclick=run;
document.fonts.ready.then(run);
</script></body></html>

body{font-family:var(--font-sans,system-ui);color:var(--foreground,#ddd);margin:0}figure{margin:0}figcaption{font-size:17px;font-weight:650;margin-bottom:6px}p{font-size:13px;color:var(--muted-foreground,#999);margin:4px 0 18px}.legend{display:flex;gap:20px;font-size:12px;margin-bottom:18px;flex-wrap:wrap}.swatch{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:2px}.present{background:var(--chart-1,#4f9cba)}.missing{background:var(--chart-2,#bd8c5e)}.row{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:12px;margin:18px 0;font-size:13px}.track{display:flex;height:28px}.bar{min-width:0;border-radius:3px}.numbers{font-variant-numeric:tabular-nums;line-height:1.5}.axis{display:flex;justify-content:space-between;margin:0 102px 0 142px;font-size:11px;color:var(--muted-foreground,#999)}.label{font-size:12px;text-align:center;color:var(--muted-foreground,#999);margin:8px 0}.note{font-size:12px;color:var(--muted-foreground,#999);margin-top:18px;line-height:1.5}@media(max-width:460px){.row{grid-template-columns:95px 1fr 70px;gap:8px}.axis{margin-left:103px;margin-right:78px}}
